name: asciidoctor-ghpages

on:
  pull_request:
    branches:
      - main
    paths:
      - 'src/main/asciidoc/**'
      - 'examples/src/main/java/**'
      - 'examples/src/main/resources/**'
      - '.github/workflows/asciidoctor-ghpages.yml'
  push:
    branches:
      - main
    paths:
      - 'src/main/asciidoc/**'
      - 'examples/src/main/java/**'
      - 'examples/src/main/resources/**'
      - '.github/workflows/asciidoctor-ghpages.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@20cf305ff2072d973412fa9b1e3a4f227bda3c76 # v2.14.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Install Asciidoctor
        run: gem install asciidoctor -v 2.0.23 --no-document

      - name: Build documentation
        run: |
          mkdir -p build/docs
          asciidoctor \
            --failure-level=WARN \
            -a nofooter \
            -a examples-java="$PWD/examples/src/main/java" \
            -D build/docs \
            src/main/asciidoc/index.adoc

      - name: Publish documentation
        if: github.event_name != 'pull_request'
        run: |
          docs_dir="$(mktemp -d)"
          cp -R build/docs/. "${docs_dir}/"
          git config --global user.email "action@github.com"
          git config --global user.name "GitHub Action"
          git switch --orphan gh-pages
          git rm -rf . >/dev/null 2>&1 || true
          cp -R "${docs_dir}/". .
          touch .nojekyll
          git add .
          git commit -m "Build documentation from ${GITHUB_SHA}"
          git push -f origin gh-pages